
<!DOCTYPE html>
<html>
<head>
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="/script.js"></script>
</head>
<body>

    <div class="container">
        <h1>Personal Expense Tracker</h1>

        <div class="summary">
            <div>
                <h3>Total Income</h3>
                <p id="income">₹0</p>
            </div>
            <div>
                <h3>Total Expenses</h3>
                <p id="expenses">₹0</p>
            </div>
            <div>
                <h3>Balance</h3>
                <p id="balance">₹0</p>
            </div>
        </div>

        <h2>Add Transaction</h2>

        <form id="transactionForm">
            <input id="title" placeholder="Transaction title" required>

            <input id="amount" type="number" min="0.01"
                step="0.01" placeholder="Amount" required>

            <input id="category" placeholder="Category" required>

            <select id="type">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>

            <input id="transactionDate" type="date" required>

            <button type="submit">Add Transaction</button>
        </form>

        <h2>Transaction History</h2>

        <div id="transactions"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
